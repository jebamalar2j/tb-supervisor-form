<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TB Supervisor Form</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --teal: #0d7377;
    --teal-light: #14a085;
    --teal-pale: #e8f5f5;
    --red: #c0392b;
    --amber: #e67e22;
    --green: #27ae60;
    --gray0: #f7f9f9;
    --gray1: #eef2f2;
    --gray2: #d1dede;
    --gray3: #8fa8a8;
    --gray4: #4a6464;
    --dark: #1a2e2e;
    --white: #ffffff;
    --shadow: 0 2px 12px rgba(13,115,119,0.10);
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--gray0);
    color: var(--dark);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    background: var(--teal);
    color: white;
    padding: 16px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
  header p  { font-size: 12px; opacity: 0.75; margin-top: 2px; }

  .container { max-width: 600px; margin: 0 auto; padding: 16px; }

  /* API key setup screen */
  #setup-screen {
    background: white;
    border-radius: var(--radius);
    padding: 24px;
    margin-top: 16px;
    box-shadow: var(--shadow);
  }
  #setup-screen h2 { font-size: 16px; color: var(--teal); margin-bottom: 8px; }
  #setup-screen p  { font-size: 13px; color: var(--gray4); margin-bottom: 16px; line-height: 1.5; }

  /* Cards */
  .card {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--teal);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--gray1);
  }

  /* Form elements */
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--gray4);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  select, input[type="date"], input[type="text"], input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--gray2);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--dark);
    background: white;
    margin-bottom: 14px;
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    transition: border-color 0.15s;
  }
  select:focus, input:focus {
    border-color: var(--teal);
  }
  select:disabled { background: var(--gray1); color: var(--gray3); }

  /* Buttons */
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--teal); color: white; }
  .btn-primary:disabled { background: var(--gray2); color: var(--gray3); cursor: not-allowed; }
  .btn-success { background: var(--green); color: white; margin-top: 8px; }
  .btn-sm {
    display: inline-block;
    width: auto;
    padding: 7px 14px;
    font-size: 13px;
    background: var(--teal-pale);
    color: var(--teal);
    border-radius: 6px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
  }

  /* Patient cards */
  .patient-card {
    border: 1.5px solid var(--gray2);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .patient-header {
    background: var(--teal-pale);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .patient-header .nikshay {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--teal);
  }
  .patient-header .num {
    font-size: 11px;
    color: var(--gray3);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .patient-header .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gray2);
    flex-shrink: 0;
  }
  .patient-header .status-dot.filled { background: var(--green); }
  .patient-body {
    padding: 16px;
    display: none;
  }
  .patient-body.open { display: block; }

  /* Status bar */
  .status-bar {
    background: var(--gray1);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status-bar .icon { font-size: 20px; }
  .status-bar .text { font-size: 13px; color: var(--gray4); }
  .status-bar .text strong { color: var(--dark); display: block; font-size: 15px; }

  /* Alert */
  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .alert-error   { background: #fdecea; color: var(--red); }
  .alert-success { background: #eafaf1; color: var(--green); }
  .alert-info    { background: var(--teal-pale); color: var(--teal); }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
  .mt8 { margin-top: 8px; }
  .progress {
    font-size: 12px;
    color: var(--gray3);
    text-align: center;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>TB Supervisor Follow-up</h1>
  <p>STLS Uniamp Nikshay Details Form</p>
</header>

<div class="container">

  <!-- API Key Setup -->
  <div id="setup-screen">
    <h2>Setup — Enter API Key</h2>
    <p>Your KoBoToolbox API key is required to fetch patient data. This is stored only on your device and never shared.</p>
    <label>KoBoToolbox API Key</label>
    <input type="password" id="api-key-input" placeholder="Paste your API key here">
    <button class="btn btn-primary" onclick="saveApiKey()">Save & Continue</button>
  </div>

  <!-- Main Form (hidden until API key saved) -->
  <div id="main-form" class="hidden">

    <!-- Step 1: Select Facility & Date -->
    <div class="card" id="step1-card">
      <div class="card-title">Step 1 — Select Facility & Date</div>

      <label>District</label>
      <select id="sel-district" onchange="onDistrictChange()">
        <option value="">— Select District —</option>
        <option>Chennai</option>
        <option>Kancheepuram</option>
        <option>Thiruvallur</option>
        <option>Tiruvannamalai</option>
      </select>

      <label>Name of TU</label>
      <select id="sel-tu" onchange="onTuChange()" disabled>
        <option value="">— Select TU —</option>
      </select>

      <label>Name of Site / DMC</label>
      <select id="sel-site" disabled>
        <option value="">— Select Site —</option>
      </select>

      <label>Date of Testing</label>
      <input type="date" id="sel-date">

      <button class="btn btn-primary" id="fetch-btn" onclick="fetchPatients()">
        Fetch Patients
      </button>
      <div id="fetch-error" class="alert alert-error hidden"></div>
    </div>

    <!-- Step 2: Patient Forms -->
    <div id="step2" class="hidden">
      <div class="status-bar">
        <span class="icon">👥</span>
        <div class="text">
          <strong id="patient-count-label"></strong>
          <span id="patient-site-label"></span>
        </div>
      </div>

      <div id="patient-forms"></div>

      <button class="btn btn-success" id="submit-all-btn" onclick="submitAll()">
        Submit All Patient Data
      </button>
      <div class="progress" id="submit-progress"></div>
      <div id="submit-result" class="hidden mt8"></div>
    </div>

  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const LAB_FORM_ID        = "aZfUng9y8YP2YDUDNkB6rW";
const SUPERVISOR_FORM_ID = "aMFPEZhHEvUS2PNpc2QAsy";
const SUPERVISOR_VERSION = "vjsLYF8sVbPLzZkVdWT6GK";
const EU_API  = "https://eu.kobotoolbox.org";
const EU_KC   = "https://kc-eu.kobotoolbox.org";

// ── TU / SITE DATA ───────────────────────────────────────────────────────────
const TU_BY_DISTRICT = {
  "Chennai": ["Thiruvetriyur","Madhavaram","Tondiarpet","Kodungaiyur","Basin_Bridge","Kolathur","Padi_Manjakuppam","Aminjikarai","Mmda","Mylapore","Virugambakkam","Kodambakkam_Tu","Saidapet_West","Chinnaporur","Nanganallur","Velachery","Puzhithivakkam","Kannagi_Nagar"],
  "Thiruvallur": ["Ammiyar_kuppam","Poonimangadu","Perampakkam","Budhur","Periyapalayam"],
  "Kancheepuram": ["Dtc_Kanchipuram","Uthiramerur","Kundrathur","Sriperumpudur","Walajabad"],
  "Tiruvannamalai": ["Jamunamarathur","Keelapennathur","Melpallipattu","Perungattur","Thatchur"]
};

const SITES_BY_TU = {
  "Thiruvetriyur":["Thangal_Uphc"],"Madhavaram":["Lakshmipuram_Uphc","Samy_Nagar_Uphc"],
  "Tondiarpet":["Korrukupet_Uphc"],"Kodungaiyur":["Sharma_Nagar"],
  "Basin_Bridge":["BRN_Garden_UPHC"],"Kolathur":["Kolathur_Uphc"],
  "Padi_Manjakuppam":["Veeramamunivar_UPHC_(mugapair_east)"],"Aminjikarai":["Chetpet_Uphc"],
  "Mmda":["Bharathipuram_Uphc"],"Mylapore":["Krishnampet_Uphc"],
  "Virugambakkam":["Virugambakkam_Uphc"],"Kodambakkam_Tu":["K.K._Nagar_UPHC"],
  "Saidapet_West":["Ragava_Colony_UPHC"],"Chinnaporur":["Sakthinagar_UPHC"],
  "Nanganallur":["Appavu_Street_UPHC"],"Velachery":["Sasthri_Nagar_UPHC","Taramani_UPHC"],
  "Puzhithivakkam":["Puzhithivakkam_UPHC"],"Kannagi_Nagar":["Neelangkarai_UPHC"],
  "Ammiyar_kuppam":["Ammaiyarkuppam_BPHC"],"Poonimangadu":["Poonimangadu_BPHC"],
  "Perampakkam":["Perambakkam_BPHC"],"Budhur":["Budhur_BPHC"],
  "Periyapalayam":["Periyapalayam_BPHC"],"Dtc_Kanchipuram":["Little_Kanchipuram"],
  "Uthiramerur":["Salavakkam"],"Kundrathur":["Mangadu"],
  "Sriperumpudur":["Vallam"],"Walajabad":["Parandur"],
  "Jamunamarathur":["Jamunamarathur"],"Keelapennathur":["Keelapennathur"],
  "Melpallipattu":["Melpallipattu"],"Perungattur":["Perungattur"],"Thatchur":["Thatchur"]
};

const DROPDOWNS = {
  CBNAAT_testing_status:         ["","MTB Detected","MTB Not detected"],
  Truenat_testing_status:        ["","MTB Detected","MTB Not detected"],
  Xray_testing_status:           ["","Suggestive of TB","Not suggestive of TB"],
  Notification:                  ["","Microbiologically confirmed TB","Clinically diagnosed TB","Follow-up case","Not a case"],
  Rif_resistance_testing_status: ["","Resistant","Not resistant","Other resistance"],
  Treatment_initiated:           ["","Yes","Not required"],
  Type_of_treatment_initiated:   ["","DS-TB","DR-TB"],
  CBNAAT_result:                 ["","Very low","Low","Medium","High"],
};

const FIELD_LABELS = {
  CBNAAT_testing_status:         "CBNAAT Testing Status",
  Truenat_testing_status:        "Truenat Testing Status",
  Xray_testing_status:           "X-ray Testing Status",
  Notification:                  "Notification",
  Rif_resistance_testing_status: "Rif Resistance Testing Status",
  Other_resistance:              "Other Resistance (if any)",
  Treatment_initiated:           "Treatment Initiated",
  Type_of_treatment_initiated:   "Type of Treatment (DS-TB/DR-TB)",
  TruNAAT_CFU_value:             "TruNAAT CFU Value",
  CBNAAT_result:                 "CBNAAT Result",
};

let nikshayPatients = [];
let apiKey = "";

// ── SETUP ───────────────────────────────────────────────────────────────────
function saveApiKey() {
  const val = document.getElementById("api-key-input").value.trim();
  if (!val) { alert("Please enter your API key."); return; }
  apiKey = val;
  localStorage.setItem("kobo_api_key", val);
  document.getElementById("setup-screen").classList.add("hidden");
  document.getElementById("main-form").classList.remove("hidden");
  // Set today's date as default
  document.getElementById("sel-date").value = new Date().toISOString().split("T")[0];
}

window.onload = () => {
  const saved = localStorage.getItem("kobo_api_key");
  if (saved) {
    apiKey = saved;
    document.getElementById("setup-screen").classList.add("hidden");
    document.getElementById("main-form").classList.remove("hidden");
    document.getElementById("sel-date").value = new Date().toISOString().split("T")[0];
  }
};

// ── CASCADING DROPDOWNS ──────────────────────────────────────────────────────
function onDistrictChange() {
  const district = document.getElementById("sel-district").value;
  const tuSel = document.getElementById("sel-tu");
  const siteSel = document.getElementById("sel-site");
  tuSel.innerHTML = '<option value="">— Select TU —</option>';
  siteSel.innerHTML = '<option value="">— Select Site —</option>';
  siteSel.disabled = true;
  if (!district) { tuSel.disabled = true; return; }
  (TU_BY_DISTRICT[district] || []).forEach(tu => {
    tuSel.innerHTML += `<option value="${tu}">${tu.replace(/_/g," ")}</option>`;
  });
  tuSel.disabled = false;
}

function onTuChange() {
  const tu = document.getElementById("sel-tu").value;
  const siteSel = document.getElementById("sel-site");
  siteSel.innerHTML = '<option value="">— Select Site —</option>';
  if (!tu) { siteSel.disabled = true; return; }
  (SITES_BY_TU[tu] || []).forEach(s => {
    siteSel.innerHTML += `<option value="${s}">${s.replace(/_/g," ")}</option>`;
  });
  siteSel.disabled = false;
}

// ── FETCH PATIENTS ───────────────────────────────────────────────────────────
async function fetchPatients() {
  const district = document.getElementById("sel-district").value;
  const tu       = document.getElementById("sel-tu").value;
  const site     = document.getElementById("sel-site").value;
  const date     = document.getElementById("sel-date").value;
  const errDiv   = document.getElementById("fetch-error");
  errDiv.classList.add("hidden");

  if (!district || !tu || !site || !date) {
    errDiv.textContent = "Please fill in all fields.";
    errDiv.classList.remove("hidden"); return;
  }

  const btn = document.getElementById("fetch-btn");
  btn.innerHTML = '<span class="spinner"></span>Fetching...';
  btn.disabled = true;

  try {
    const resp = await fetch(
      `${EU_API}/api/v2/assets/${LAB_FORM_ID}/data/?format=json&limit=5000`,
      { headers: { "Authorization": `Token ${apiKey}` } }
    );
    if (!resp.ok) throw new Error(`API error ${resp.status}`);
    const data = await resp.json();
    const submissions = data.results || [];

    // Extract Nikshay IDs
    nikshayPatients = [];
    for (const sub of submissions) {
      const rows = sub["group_mb5pc30"] || [];
      for (const row of rows) {
        const rd = row["group_mb5pc30/district_repeat"] || "";
        const rs = row["group_mb5pc30/facility_name_repeat"] || "";
        const rdate = String(row["group_mb5pc30/Date_of_testing"] || "");
        const nid = row["group_mb5pc30/Patient_Ni_kshay_ID"];
        if (rd === district && rs === site && rdate.startsWith(date) && nid) {
          if (!nikshayPatients.find(p => p.nid === String(nid))) {
            nikshayPatients.push({ nid: String(nid) });
          }
        }
      }
    }

    if (nikshayPatients.length === 0) {
      errDiv.textContent = `No patients found for ${site.replace(/_/g," ")} on ${date}. Check that the lab form has been submitted for this date.`;
      errDiv.classList.remove("hidden");
    } else {
      renderPatientForms(district, tu, site, date);
    }
  } catch(e) {
    errDiv.textContent = "Error: " + e.message;
    errDiv.classList.remove("hidden");
  }

  btn.innerHTML = "Fetch Patients";
  btn.disabled = false;
}

// ── RENDER PATIENT FORMS ─────────────────────────────────────────────────────
function renderPatientForms(district, tu, site, date) {
  document.getElementById("patient-count-label").textContent =
    `${nikshayPatients.length} patient(s) found`;
  document.getElementById("patient-site-label").textContent =
    `${site.replace(/_/g," ")} · ${date}`;

  const container = document.getElementById("patient-forms");
  container.innerHTML = "";

  nikshayPatients.forEach((p, i) => {
    const pid = `patient_${i}`;
    let fieldsHtml = "";

    // Nikshay ID (read only)
    fieldsHtml += `
      <label>Patient Ni-kshay ID</label>
      <input type="text" value="${p.nid}" readonly style="background:#f0f8f8;color:var(--teal);font-family:'DM Mono',monospace;font-weight:500;">
    `;

    // Dropdowns
    for (const [field, options] of Object.entries(DROPDOWNS)) {
      // Conditional visibility
      const showIf = {
        "Type_of_treatment_initiated": () => getVal(pid, "Treatment_initiated") === "Yes",
        "CBNAAT_result": () => getVal(pid, "CBNAAT_testing_status") === "MTB Detected",
      };
      const condId = showIf[field] ? `data-cond="${field}"` : "";
      const opts = options.map(o => `<option value="${o}">${o || "— Select —"}</option>`).join("");
      fieldsHtml += `
        <div id="${pid}_wrap_${field}">
          <label>${FIELD_LABELS[field]}</label>
          <select id="${pid}_${field}" onchange="updatePatientStatus(${i}); checkConditions('${pid}')" ${condId}>
            ${opts}
          </select>
        </div>`;
    }

    // Other resistance free text
    fieldsHtml += `
      <div id="${pid}_wrap_Other_resistance" class="hidden">
        <label>${FIELD_LABELS["Other_resistance"]}</label>
        <input type="text" id="${pid}_Other_resistance" placeholder="Specify resistance">
      </div>`;

    // TruNAAT CFU
    fieldsHtml += `
      <label>${FIELD_LABELS["TruNAAT_CFU_value"]}</label>
      <input type="text" id="${pid}_TruNAAT_CFU_value" placeholder="Free text">
    `;

    container.innerHTML += `
      <div class="patient-card" id="card_${pid}">
        <div class="patient-header" onclick="togglePatient('${pid}')">
          <div>
            <div class="num">Patient ${i+1}</div>
            <div class="nikshay">${p.nid}</div>
          </div>
          <div class="status-dot" id="dot_${pid}"></div>
        </div>
        <div class="patient-body" id="body_${pid}">
          ${fieldsHtml}
        </div>
      </div>`;
  });

  // Open first patient
  if (nikshayPatients.length > 0) {
    document.getElementById("body_patient_0").classList.add("open");
  }

  document.getElementById("step2").classList.remove("hidden");
  document.getElementById("step2").scrollIntoView({ behavior: "smooth" });
}

function togglePatient(pid) {
  const body = document.getElementById("body_" + pid);
  body.classList.toggle("open");
}

function getVal(pid, field) {
  const el = document.getElementById(`${pid}_${field}`);
  return el ? el.value : "";
}

function checkConditions(pid) {
  // Type of treatment — show only if Treatment = Yes
  const treatWrap = document.getElementById(`${pid}_wrap_Type_of_treatment_initiated`);
  if (treatWrap) {
    treatWrap.style.display = getVal(pid, "Treatment_initiated") === "Yes" ? "" : "none";
  }
  // CBNAAT result — show only if CBNAAT = MTB Detected
  const cbnWrap = document.getElementById(`${pid}_wrap_CBNAAT_result`);
  if (cbnWrap) {
    cbnWrap.style.display = getVal(pid, "CBNAAT_testing_status") === "MTB Detected" ? "" : "none";
  }
  // Other resistance — show if Resistant or Other
  const rifVal = getVal(pid, "Rif_resistance_testing_status");
  const otherWrap = document.getElementById(`${pid}_wrap_Other_resistance`);
  if (otherWrap) {
    otherWrap.classList.toggle("hidden",
      rifVal !== "Resistant" && rifVal !== "Other resistance");
  }
}

function updatePatientStatus(i) {
  const pid = `patient_${i}`;
  const dot = document.getElementById(`dot_${pid}`);
  const required = ["CBNAAT_testing_status","Truenat_testing_status",
                    "Xray_testing_status","Notification","Treatment_initiated"];
  const filled = required.every(f => getVal(pid, f) !== "");
  dot.classList.toggle("filled", filled);
}

// ── SUBMIT ALL ───────────────────────────────────────────────────────────────
async function submitAll() {
  const district = document.getElementById("sel-district").value;
  const tu       = document.getElementById("sel-tu").value;
  const site     = document.getElementById("sel-site").value;
  const date     = document.getElementById("sel-date").value;

  const btn = document.getElementById("submit-all-btn");
  const prog = document.getElementById("submit-progress");
  const resultDiv = document.getElementById("submit-result");
  btn.disabled = true;
  resultDiv.classList.add("hidden");

  let successCount = 0;
  let failCount = 0;

  // Submit one combined XML with all patients as repeat rows
  const repeat_xml = nikshayPatients.map((p, i) => {
    const pid = `patient_${i}`;
    const fields = [
      "CBNAAT_testing_status","Truenat_testing_status","Xray_testing_status",
      "Notification","Rif_resistance_testing_status","Other_resistance",
      "Treatment_initiated","Type_of_treatment_initiated",
      "TruNAAT_CFU_value","CBNAAT_result"
    ];
    let rowXml = `<group_patients><Patient_Ni_kshay_ID>${p.nid}</Patient_Ni_kshay_ID>`;
    fields.forEach(f => {
      const val = (document.getElementById(`${pid}_${f}`) || {}).value || "";
      rowXml += `<${f}>${escXml(val)}</${f}>`;
    });
    rowXml += `</group_patients>`;
    return rowXml;
  }).join("\n");

  const uid = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
  const xml = `<?xml version="1.0" encoding="UTF-8"?>
<${SUPERVISOR_FORM_ID} id="${SUPERVISOR_FORM_ID}" version="${SUPERVISOR_VERSION}">
  <formhub><uuid>${uid}</uuid></formhub>
  <group_header>
    <district>${district}</district>
    <tu>${tu}</tu>
    <site>${site}</site>
    <Date_of_testing>${date}</Date_of_testing>
  </group_header>
  ${repeat_xml}
  <meta><instanceID>uuid:${uid}</instanceID></meta>
</${SUPERVISOR_FORM_ID}>`;

  prog.textContent = "Submitting...";

  try {
    const formData = new FormData();
    formData.append("xml_submission_file", new Blob([xml], {type:"text/xml"}), "submission.xml");

    const resp = await fetch(`${EU_KC}/api/v1/submissions`, {
      method: "POST",
      headers: { "Authorization": `Token ${apiKey}` },
      body: formData
    });

    if (resp.ok) {
      prog.textContent = "";
      resultDiv.className = "alert alert-success mt8";
      resultDiv.textContent = `✓ Submitted successfully for ${nikshayPatients.length} patient(s)! Data is now in KoBoToolbox.`;
      resultDiv.classList.remove("hidden");
    } else {
      const txt = await resp.text();
      prog.textContent = "";
      resultDiv.className = "alert alert-error mt8";
      resultDiv.textContent = `Error ${resp.status}: ${txt.slice(0,200)}`;
      resultDiv.classList.remove("hidden");
    }
  } catch(e) {
    prog.textContent = "";
    resultDiv.className = "alert alert-error mt8";
    resultDiv.textContent = "Network error: " + e.message;
    resultDiv.classList.remove("hidden");
  }

  btn.disabled = false;
}

function escXml(str) {
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Hide conditional fields on load
document.addEventListener("DOMContentLoaded", () => {});
</script>
